<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pine Grove Daily Schedule</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --green: #dfeee0;
  --green-dark: #789879;

  --blue: #e2edf4;
  --blue-dark: #7893a6;

  --orange: #f5e8d8;
  --orange-dark: #b58c5d;

  --line: #c9cec9;
  --text: #27312a;
  --muted: #68716a;

  /* Controls how tall the schedule is */
  --minute-height: 1.18px;
}

body {
  margin: 0;
  padding: 24px;
  background: #f3f1eb;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  max-width: 1500px;
  margin: auto;
}

/* ---------------- HEADER ---------------- */

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 14px;
}

.day-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.day-control label {
  font-size: 13px;
  font-weight: 700;
}

select {
  padding: 8px 32px 8px 10px;
  border: 1px solid #b7bdb8;
  border-radius: 8px;
  background: white;
  font-size: 15px;
}

/* ---------------- CARD ---------------- */

.card {
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
}

h2 {
  margin: 0 0 12px;
  font-size: 20px;
}

/* ---------------- PRIMARY ---------------- */

.primary-layout {
  display: grid;
  grid-template-columns: 115px repeat(3, 1fr);
  grid-template-rows: 44px auto;

  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

/* HEADERS */

.activity-header,
.room-header {
  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 700;
  border-bottom: 1px solid var(--line);
}

.activity-header {
  background: #edf0ec;
}

.room-header {
  border-left: 1px solid var(--line);
}

.spruce-header {
  background: var(--green);
}

.birch-header {
  background: var(--blue);
}

.maple-header {
  background: var(--orange);
}

/* ---------------- TIMELINE ---------------- */

.activity-track,
.room-track {
  position: relative;

  /*
  8:15–3:30 = 435 minutes.
  Height is calculated from minute-height.
  */
  height: calc(435 * var(--minute-height));
}

.room-track {
  border-left: 1px solid var(--line);
}

/* ---------------- ACTIVITY BLOCKS ---------------- */

.activity-block {
  position: absolute;
  left: 0;
  right: 0;

  padding: 8px;

  border-top: 1px solid var(--line);

  display: flex;
  flex-direction: column;
  justify-content: center;

  background: #f7f6f2;

  overflow: hidden;
}

.activity-block:first-child {
  border-top: none;
}

.activity-name {
  font-weight: 700;
  font-size: 14px;
  line-height: 1.1;
}

.activity-time {
  margin-top: 4px;
  font-size: 10px;
  color: var(--muted);
}

/* ---------------- ACTIVITY LINES THROUGH ROOMS ---------------- */

.activity-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: #d5d9d5;
  z-index: 1;
}

/* ---------------- STAFF BLOCKS ---------------- */

.staff-block {
  position: absolute;

  border-radius: 6px;

  padding: 6px 4px;

  font-size: 12px;

  overflow: hidden;

  z-index: 2;

  border-width: 0 0 0 3px;
  border-style: solid;

  min-width: 0;
}

.staff-name {
  display: block;
  font-weight: 700;
  line-height: 1.05;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.staff-time {
  display: block;

  margin-top: 3px;

  font-size: 9px;
  line-height: 1.05;

  color: #5f675f;

  white-space: nowrap;
}

/* ROOM COLORS */

.spruce-block {
  background: rgba(220, 238, 220, .92);
  border-color: var(--green-dark);
}

.birch-block {
  background: rgba(226, 237, 244, .94);
  border-color: var(--blue-dark);
}

.maple-block {
  background: rgba(245, 232, 216, .94);
  border-color: var(--orange-dark);
}

/* ---------------- TIME MARKERS ---------------- */

.time-marker {
  position: absolute;
  left: 3px;

  transform: translateY(-50%);

  padding: 1px 3px;

  background: #f7f6f2;

  font-size: 9px;
  color: #747b75;

  z-index: 3;
}

/* ---------------- STATUS ---------------- */

.status {
  padding: 40px;
  text-align: center;
  color: var(--muted);
}

.error {
  color: #9b3838;
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 800px) {

  body {
    padding: 10px;
  }

  .card {
    padding: 10px;
  }

  .primary-layout {
    grid-template-columns: 85px repeat(3, minmax(150px, 1fr));
    overflow-x: auto;
  }

}

/* ---------------- PRINT ---------------- */

@media print {

  body {
    padding: 0;
    background: white;
  }

  .card {
    box-shadow: none;
  }

  .day-control {
    display: none;
  }

}

</style>
</head>

<body>

<div class="page">

<header>

  <div>
    <h1>Daily Staff Schedule</h1>
    <div class="subtitle">
      Pine Grove Montessori School
    </div>
  </div>

  <div class="day-control">

    <label for="day">Day</label>

    <select id="day">
      <option>Monday</option>
      <option>Tuesday</option>
      <option selected>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
    </select>

  </div>

</header>

<div class="card">

  <h2>Primary</h2>

  <div id="content">
    <div class="status">
      Loading schedule…
    </div>
  </div>

</div>

</div>


<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vS4807ECz35YOfslHd7b3Lya0mIG7qqbzDzfpMuV2JCwMkL_bkVujxZ5DWdj_YLMDoT6BHYWU97giNn/pub?gid=1831595603&single=true&output=csv";


/* =========================================================
   PRIMARY SETTINGS
========================================================= */

const DAY_START = 8 * 60 + 15;   // 8:15 AM
const DAY_END   = 15 * 60 + 30;  // 3:30 PM
const DAY_LENGTH = DAY_END - DAY_START;


const rooms = [
  "Spruce",
  "Birch",
  "Maple"
];


const activities = [

  {
    name: "Work Cycle",
    start: 8 * 60 + 15,
    end: 11 * 60 + 15
  },

  {
    name: "Morning Recess",
    start: 11 * 60 + 15,
    end: 12 * 60 + 15
  },

  {
    name: "Lunch",
    start: 12 * 60 + 15,
    end: 13 * 60
  },

  {
    name: "Rest",
    start: 13 * 60,
    end: 14 * 60 + 30
  },

  {
    name: "Afternoon Recess",
    start: 14 * 60 + 30,
    end: 15 * 60 + 30
  }

];


let scheduleData = [];


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let quoted = false;


  for (let i = 0; i < text.length; i++) {

    const char = text[i];


    if (char === '"') {

      if (quoted && text[i + 1] === '"') {

        cell += '"';
        i++;

      } else {

        quoted = !quoted;

      }

    }


    else if (char === "," && !quoted) {

      row.push(cell);
      cell = "";

    }


    else if (
      (char === "\n" || char === "\r") &&
      !quoted
    ) {

      if (
        char === "\r" &&
        text[i + 1] === "\n"
      ) {
        i++;
      }

      row.push(cell);

      if (
        row.some(value => value !== "")
      ) {
        rows.push(row);
      }

      row = [];
      cell = "";

    }


    else {

      cell += char;

    }

  }


  if (cell || row.length) {

    row.push(cell);
    rows.push(row);

  }


  const headers =
    rows.shift().map(
      header => header.trim()
    );


  return rows.map(values => {

    const object = {};

    headers.forEach(
      (header, index) => {

        object[header] =
          (values[index] || "").trim();

      }
    );

    return object;

  });

}


/* =========================================================
   TIME FUNCTIONS
========================================================= */

function timeToMinutes(value) {

  if (!value) return null;


  const match =
    value.match(
      /(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i
    );


  if (!match) return null;


  let hour = Number(match[1]);

  const minute =
    Number(match[2]);

  const period =
    match[3];


  if (period) {

    if (
      period.toUpperCase() === "PM" &&
      hour !== 12
    ) {
      hour += 12;
    }

    if (
      period.toUpperCase() === "AM" &&
      hour === 12
    ) {
      hour = 0;
    }

  }


  return hour * 60 + minute;

}


function minutesToLabel(minutes) {

  let hour =
    Math.floor(minutes / 60);

  const minute =
    minutes % 60;

  const period =
    hour >= 12 ? "PM" : "AM";


  hour %= 12;

  if (hour === 0) {
    hour = 12;
  }


  return (
    hour +
    ":" +
    String(minute).padStart(2, "0") +
    " " +
    period
  );

}


/* =========================================================
   DAY CHECK
========================================================= */

function worksOnDay(row, day) {

  const value =
    String(row[day] || "")
      .toLowerCase();


  return (
    value === "true" ||
    value === "yes" ||
    value === "1"
  );

}


/* =========================================================
   GET STAFF ASSIGNMENTS
========================================================= */

function getStaffAssignments(room, day) {

  return scheduleData
    .filter(row => {

      if (row.Assignment !== room) {
        return false;
      }

      if (!worksOnDay(row, day)) {
        return false;
      }


      const start =
        timeToMinutes(row.Start);

      const end =
        timeToMinutes(row.End);


      if (
        start === null ||
        end === null
      ) {
        return false;
      }


      return (
        start < DAY_END &&
        end > DAY_START
      );

    })

    .map(row => ({

      staff: row.Staff,

      start:
        Math.max(
          DAY_START,
          timeToMinutes(row.Start)
        ),

      end:
        Math.min(
          DAY_END,
          timeToMinutes(row.End)
        )

    }))

    .sort((a, b) => {

      if (a.start !== b.start) {
        return a.start - b.start;
      }

      return a.end - b.end;

    });

}


/* =========================================================
   MERGE CONTINUOUS ASSIGNMENTS FOR SAME PERSON

   Example:
   Brooke 8:15–11:15
   Brooke 11:15–11:45

   becomes:

   Brooke 8:15–11:45
========================================================= */

function mergeContinuousAssignments(assignments) {

  const byStaff = {};


  assignments.forEach(item => {

    if (!byStaff[item.staff]) {
      byStaff[item.staff] = [];
    }

    byStaff[item.staff].push(item);

  });


  const merged = [];


  Object.keys(byStaff).forEach(staff => {

    const items =
      byStaff[staff]
        .sort(
          (a, b) =>
            a.start - b.start
        );


    let current = null;


    items.forEach(item => {

      if (!current) {

        current = {
          staff: staff,
          start: item.start,
          end: item.end
        };

        return;

      }


      if (item.start <= current.end) {

        current.end =
          Math.max(
            current.end,
            item.end
          );

      }

      else {

        merged.push(current);

        current = {
          staff: staff,
          start: item.start,
          end: item.end
        };

      }

    });


    if (current) {
      merged.push(current);
    }

  });


  return merged.sort(
    (a, b) =>
      a.start - b.start
  );

}


/* =========================================================
   ASSIGN SIDE-BY-SIDE LANES

   Teachers who overlap are placed next to each other
   INSIDE the classroom column.
========================================================= */

function assignLanes(assignments) {

  const lanes = [];


  assignments.forEach(item => {

    let laneIndex = -1;


    for (
      let i = 0;
      i < lanes.length;
      i++
    ) {

      if (
        lanes[i] <= item.start
      ) {

        laneIndex = i;
        break;

      }

    }


    if (laneIndex === -1) {

      laneIndex =
        lanes.length;

      lanes.push(item.end);

    }

    else {

      lanes[laneIndex] =
        item.end;

    }


    item.lane =
      laneIndex;

  });


  return {
    assignments,
    laneCount:
      Math.max(
        lanes.length,
        1
      )
  };

}


/* =========================================================
   CREATE ACTIVITY TRACK
========================================================= */

function createActivityTrack() {

  const track =
    document.createElement("div");

  track.className =
    "activity-track";


  activities.forEach(
    (activity, index) => {

      const block =
        document.createElement("div");

      block.className =
        "activity-block";


      const top =
        ((activity.start - DAY_START) /
          DAY_LENGTH) * 100;


      const height =
        ((activity.end - activity.start) /
          DAY_LENGTH) * 100;


      block.style.top =
        top + "%";

      block.style.height =
        height + "%";


      block.innerHTML =

        '<span class="activity-name">' +
        activity.name +
        "</span>" +

        '<span class="activity-time">' +
        minutesToLabel(activity.start) +
        "–" +
        minutesToLabel(activity.end) +
        "</span>";


      track.appendChild(block);


      if (index > 0) {

        const marker =
          document.createElement("div");

        marker.className =
          "time-marker";

        marker.style.top =
          top + "%";

        marker.textContent =
          minutesToLabel(
            activity.start
          );

        track.appendChild(marker);

      }

    }
  );


  return track;

}


/* =========================================================
   CREATE CLASSROOM TRACK
========================================================= */

function createRoomTrack(room, day) {

  const track =
    document.createElement("div");

  track.className =
    "room-track";


  /* Activity divider lines */

  activities.forEach(
    (activity, index) => {

      if (index === 0) {
        return;
      }


      const line =
        document.createElement("div");

      line.className =
        "activity-line";


      const top =
        ((activity.start - DAY_START) /
          DAY_LENGTH) * 100;


      line.style.top =
        top + "%";


      track.appendChild(line);

    }
  );


  /* Get each person's continuous assignment */

  let assignments =
    getStaffAssignments(
      room,
      day
    );


  assignments =
    mergeContinuousAssignments(
      assignments
    );


  const laneData =
    assignLanes(
      assignments
    );


  const laneCount =
    laneData.laneCount;


  laneData.assignments.forEach(
    item => {

      const block =
        document.createElement("div");


      const roomClass =
        room.toLowerCase();


      block.className =
        "staff-block " +
        roomClass +
        "-block";


      const top =
        ((item.start - DAY_START) /
          DAY_LENGTH) * 100;


      const height =
        ((item.end - item.start) /
          DAY_LENGTH) * 100;


      /*
      Each overlapping teacher gets a vertical lane.
      */

      const laneWidth =
        100 / laneCount;


      block.style.left =
        "calc(" +
        (item.lane * laneWidth) +
        "% + 3px)";


      block.style.width =
        "calc(" +
        laneWidth +
        "% - 6px)";


      block.style.top =
        "calc(" +
        top +
        "% + 2px)";


      block.style.height =
        "calc(" +
        height +
        "% - 4px)";


      block.innerHTML =

        '<span class="staff-name">' +
        item.staff +
        "</span>" +

        '<span class="staff-time">' +
        minutesToLabel(item.start) +
        "–" +
        minutesToLabel(item.end) +
        "</span>";


      track.appendChild(block);

    }
  );


  return track;

}


/* =========================================================
   RENDER PRIMARY
========================================================= */

function renderPrimary() {

  const day =
    document
      .getElementById("day")
      .value;


  const content =
    document
      .getElementById("content");


  content.innerHTML = "";


  const layout =
    document.createElement("div");

  layout.className =
    "primary-layout";


  /* Activity header */

  const activityHeader =
    document.createElement("div");

  activityHeader.className =
    "activity-header";

  activityHeader.textContent =
    "Activity";

  layout.appendChild(
    activityHeader
  );


  /* Classroom headers */

  rooms.forEach(room => {

    const header =
      document.createElement("div");

    header.className =
      "room-header " +
      room.toLowerCase() +
      "-header";

    header.textContent =
      room;

    layout.appendChild(header);

  });


  /* Activity column */

  layout.appendChild(
    createActivityTrack()
  );


  /* Classroom timelines */

  rooms.forEach(room => {

    layout.appendChild(
      createRoomTrack(
        room,
        day
      )
    );

  });


  content.appendChild(layout);

}


/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadSchedule() {

  try {

    const response =
      await fetch(CSV_URL);


    if (!response.ok) {

      throw new Error(
        "Could not load schedule."
      );

    }


    const text =
      await response.text();


    scheduleData =
      parseCSV(text);


    renderPrimary();

  }

  catch (error) {

    document
      .getElementById("content")
      .innerHTML =

      '<div class="status error">' +
      "The schedule could not be loaded." +
      "</div>";


    console.error(error);

  }

}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById("day")
  .addEventListener(
    "change",
    renderPrimary
  );


loadSchedule();

</script>

</body>
</html>
