<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pine Grove Daily Schedule</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --text:#27312a;
  --muted:#68716a;
  --line:#c9cec9;
  --page:#f3f1eb;

  --spruce:#e1efe1;
  --spruce-dark:#789879;

  --birch:#e2edf4;
  --birch-dark:#7893a6;

  --maple:#f5e8d8;
  --maple-dark:#b58c5d;

  --seedlings:#f4e1e9;
  --seedlings-dark:#a9798b;

  --care:#e8e1f1;
  --care-dark:#8876a0;

  --other:#eee9d4;
  --other-dark:#9a8b56;
}

/* =========================================================
   PAGE
========================================================= */

body {
  margin:0;
  padding:20px;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--page);
  color:var(--text);
}

.page {
  max-width:1500px;
  margin:auto;
}

/* =========================================================
   HEADER
========================================================= */

header {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:14px;
}

h1 {
  margin:0;
  font-size:27px;
}

.subtitle {
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.day-control {
  display:flex;
  align-items:center;
  gap:8px;
}

.day-control label {
  font-weight:bold;
  font-size:13px;
}

select {
  padding:7px 30px 7px 10px;
  border:1px solid #b8beb9;
  border-radius:8px;
  background:white;
  font-size:14px;
}

/* =========================================================
   GENERAL CARDS
========================================================= */

.card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
  margin-bottom:12px;
}

.section-title {
  margin:0 0 10px;
  font-size:18px;
}

/* =========================================================
   EARLY / AFTER CARE
========================================================= */

.care-grid {
  display:grid;
  gap:8px;
}

.early-grid {
  grid-template-columns:1fr 1fr;
}

.after-grid {
  grid-template-columns:repeat(4,1fr);
}

.care-box {
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}

.care-title {
  padding:7px 9px;
  background:var(--care);
  font-size:12px;
  font-weight:bold;
  text-align:center;
  border-bottom:1px solid var(--line);
}

.care-content {
  padding:8px;
  min-height:48px;
  text-align:center;
  font-size:13px;

  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:4px;
}

.care-person {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  margin:2px;
  padding:5px 8px;

  background:#f3eff7;
  border-left:3px solid var(--care-dark);
  border-radius:5px;

  text-align:center;
}

.care-time {
  display:block;
  margin-top:2px;
  font-size:9px;
  color:var(--muted);
}

/* Gathering box */

.gathering-box {
  margin-top:8px;
  padding:8px;

  border:1px dashed #bcb3c8;
  border-radius:6px;

  background:#faf8fc;

  text-align:center;
}

.gathering-label {
  display:block;

  margin-bottom:5px;

  font-size:10px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.04em;

  color:var(--care-dark);
}

.gathering-people {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:4px;
}

/* =========================================================
   PRIMARY + SEEDLINGS
========================================================= */

.school-grid {
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(300px,.9fr);
  gap:12px;
}

.schedule-card {
  background:white;
  border-radius:12px;
  padding:14px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.schedule-title {
  margin:0 0 9px;
  font-size:18px;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline-layout {
  display:grid;
  grid-template-rows:38px auto;

  border:1px solid var(--line);
  border-radius:9px;
  overflow:hidden;
}

.primary-layout {
  grid-template-columns:100px repeat(3,1fr);
}

.seedlings-layout {
  grid-template-columns:105px 1fr;
}

.timeline-header {
  display:flex;
  justify-content:center;
  align-items:center;

  padding:5px;

  font-size:13px;
  font-weight:bold;

  text-align:center;

  border-bottom:1px solid var(--line);
}

.activity-header {
  background:#edf0ec;
}

.room-header {
  border-left:1px solid var(--line);
}

.spruce-header {
  background:var(--spruce);
}

.birch-header {
  background:var(--birch);
}

.maple-header {
  background:var(--maple);
}

.seedlings-header {
  background:var(--seedlings);
}

/*
8:15 AM – 3:45 PM
450 minutes total
*/

.activity-track,
.room-track {
  position:relative;
  height:515px;
}

.room-track {
  border-left:1px solid var(--line);
}

/* =========================================================
   ACTIVITY BLOCKS
========================================================= */

.activity-block {
  position:absolute;
  left:0;
  right:0;

  padding:7px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  background:#f7f6f2;

  border-top:1px solid var(--line);

  overflow:hidden;
}

.activity-block:first-child {
  border-top:none;
}

.activity-name {
  font-weight:bold;
  font-size:12px;
  line-height:1.1;
}

.activity-time {
  margin-top:4px;

  color:var(--muted);

  font-size:9px;
  line-height:1.1;
}

.activity-line {
  position:absolute;

  left:0;
  right:0;

  height:1px;

  background:#d3d7d3;

  z-index:1;
}

/* =========================================================
   STAFF BLOCKS
========================================================= */

.staff-block {
  position:absolute;

  z-index:2;

  padding:5px 3px;

  border-radius:5px;

  border-left:3px solid;

  overflow:hidden;

  font-size:11px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.staff-name {
  display:block;

  width:100%;

  font-weight:bold;
  line-height:1.1;

  text-align:center;

  white-space:normal;
  overflow-wrap:anywhere;
}

.staff-time {
  display:block;

  width:100%;

  margin-top:3px;

  font-size:8px;
  line-height:1.1;

  color:#5f675f;

  text-align:center;

  white-space:normal;
}

.spruce-block {
  background:rgba(225,239,225,.94);
  border-color:var(--spruce-dark);
}

.birch-block {
  background:rgba(226,237,244,.94);
  border-color:var(--birch-dark);
}

.maple-block {
  background:rgba(245,232,216,.94);
  border-color:var(--maple-dark);
}

.seedlings-block {
  background:rgba(244,225,233,.95);
  border-color:var(--seedlings-dark);
}

/* =========================================================
   OTHER DUTIES
========================================================= */

.duties-table {
  display:grid;

  grid-template-columns:120px 180px 1fr;

  border:1px solid var(--line);
  border-radius:8px;

  overflow:hidden;
}

.duty-header {
  padding:6px 8px;

  background:var(--other);

  font-size:11px;
  font-weight:bold;

  border-bottom:1px solid var(--line);
}

.duty-cell {
  padding:7px 8px;

  font-size:12px;

  border-top:1px solid #e1e3e1;
}

.duty-name {
  font-weight:bold;
}

.empty-message {
  grid-column:1 / -1;

  padding:10px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.status {
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.error {
  color:#9b3838;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:950px) {

  .school-grid {
    grid-template-columns:1fr;
  }

  .after-grid {
    grid-template-columns:1fr 1fr;
  }

}

@media (max-width:600px) {

  body {
    padding:8px;
  }

  header {
    align-items:flex-start;
    flex-direction:column;
  }

  .early-grid,
  .after-grid {
    grid-template-columns:1fr;
  }

}

/* =========================================================
   PRINT
========================================================= */

@media print {

  body {
    padding:0;
    background:white;
  }

  .card,
  .schedule-card {
    box-shadow:none;
  }

  .day-control {
    display:none;
  }

  .school-grid {
    grid-template-columns:2fr .9fr;
  }

}

</style>
</head>


<body>

<div class="page">

    <!-- SEEDLINGS 4:30 -->

    <div class="care-box">

      </div>

    <!-- SEEDLINGS 5:30 -->

    <div class="care-box">

      <div class="care-title">

<script>

/* =========================================================
   GOOGLE SHEET
========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vS4807ECz35YOfslHd7b3Lya0mIG7qqbzDzfpMuV2JCwMkL_bkVujxZ5DWdj_YLMDoT6BHYWU97giNn/pub?gid=1831595603&single=true&output=csv";


/* =========================================================
   SCHOOL DAY

   8:15 AM – 3:45 PM
========================================================= */

const DAY_START =
  8 * 60 + 15;

const DAY_END =
  15 * 60 + 45;

const DAY_LENGTH =
  DAY_END - DAY_START;


/* =========================================================
   PRIMARY ACTIVITIES
========================================================= */

const primaryActivities = [

  {
    name:"Work Cycle",
    start:8 * 60 + 15,
    end:11 * 60 + 15
  },

  {
    name:"Morning Recess",
    start:11 * 60 + 15,
    end:12 * 60 + 15
  },

  {
    name:"Lunch",
    start:12 * 60 + 15,
    end:13 * 60
  },

  {
    name:"Rest",
    start:13 * 60,
    end:14 * 60 + 30
  },

  {
    name:"Afternoon Recess",
    start:14 * 60 + 30,
    end:15 * 60 + 45
  }

];


/* =========================================================
   SEEDLINGS ACTIVITIES
========================================================= */

const seedlingsActivities = [

  {
    name:"Work Cycle",
    start:8 * 60 + 15,
    end:10 * 60 + 30
  },

  {
    name:"Morning Recess",
    start:10 * 60 + 30,
    end:11 * 60 + 45
  },

  {
    name:"Lunch",
    start:11 * 60 + 45,
    end:12 * 60 + 30
  },

  {
    name:"Rest",
    start:12 * 60 + 30,
    end:14 * 60 + 30
  },

  {
    name:"Afternoon Recess",
    start:14 * 60 + 30,
    end:15 * 60 + 45
  }

];


let scheduleData = [];


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let quoted = false;


  for (let i = 0; i < text.length; i++) {

    const char = text[i];


    if (char === '"') {

      if (
        quoted &&
        text[i + 1] === '"'
      ) {

        cell += '"';
        i++;

      }

      else {

        quoted = !quoted;

      }

    }


    else if (
      char === "," &&
      !quoted
    ) {

      row.push(cell);

      cell = "";

    }


    else if (
      (char === "\n" ||
       char === "\r") &&
      !quoted
    ) {

      if (
        char === "\r" &&
        text[i + 1] === "\n"
      ) {

        i++;

      }


      row.push(cell);


      if (
        row.some(
          value => value !== ""
        )
      ) {

        rows.push(row);

      }


      row = [];
      cell = "";

    }


    else {

      cell += char;

    }

  }


  if (
    cell ||
    row.length
  ) {

    row.push(cell);

    rows.push(row);

  }


  const headers =
    rows
      .shift()
      .map(
        header =>
          header.trim()
      );


  return rows.map(values => {

    const object = {};


    headers.forEach(
      (header,index) => {

        object[header] =
          (values[index] || "")
            .trim();

      }
    );


    return object;

  });

}


/* =========================================================
   TIME FUNCTIONS
========================================================= */

function timeToMinutes(value) {

  if (!value) {
    return null;
  }


  const match =
    value.match(
      /(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i
    );


  if (!match) {
    return null;
  }


  let hour =
    Number(match[1]);

  const minute =
    Number(match[2]);

  const period =
    match[3];


  if (period) {

    if (
      period.toUpperCase() === "PM" &&
      hour !== 12
    ) {

      hour += 12;

    }


    if (
      period.toUpperCase() === "AM" &&
      hour === 12
    ) {

      hour = 0;

    }

  }


  return (
    hour * 60 +
    minute
  );

}


function minutesToLabel(minutes) {

  let hour =
    Math.floor(
      minutes / 60
    );

  const minute =
    minutes % 60;


  const period =
    hour >= 12
      ? "PM"
      : "AM";


  hour %= 12;


  if (hour === 0) {
    hour = 12;
  }


  return (
    hour +
    ":" +
    String(minute)
      .padStart(2,"0") +
    " " +
    period
  );

}


/* =========================================================
   DAY MATCHING
========================================================= */

function worksOnDay(row,day) {

  const value =
    String(
      row[day] || ""
    )
    .toLowerCase();


  return (
    value === "true" ||
    value === "yes" ||
    value === "1"
  );

}


/* =========================================================
   GET ASSIGNMENTS
========================================================= */

function getAssignments(
  assignment,
  day
) {

  return scheduleData

    .filter(row => {

      return (

        row.Assignment ===
          assignment &&

        worksOnDay(
          row,
          day
        )

      );

    })

    .map(row => ({

      staff:
        row.Staff,

      start:
        timeToMinutes(
          row.Start
        ),

      end:
        timeToMinutes(
          row.End
        )

    }))

    .filter(item => {

      return (

        item.start !== null &&
        item.end !== null

      );

    });

}


/* =========================================================
   MERGE CONTINUOUS ASSIGNMENTS
========================================================= */

function mergeContinuous(items) {

  const groups = {};


  items.forEach(item => {

    if (!groups[item.staff]) {

      groups[item.staff] = [];

    }


    groups[item.staff]
      .push(item);

  });


  const result = [];


  Object
    .keys(groups)
    .forEach(staff => {


      const staffItems =
        groups[staff]
          .sort(
            (a,b) =>
              a.start - b.start
          );


      let current = null;


      staffItems.forEach(item => {


        if (!current) {

          current = {

            staff:staff,
            start:item.start,
            end:item.end

          };

        }


        else if (
          item.start <=
          current.end
        ) {

          current.end =
            Math.max(
              current.end,
              item.end
            );

        }


        else {

          result.push(
            current
          );


          current = {

            staff:staff,
            start:item.start,
            end:item.end

          };

        }

      });


      if (current) {

        result.push(
          current
        );

      }

    });


  return result.sort(
    (a,b) =>
      a.start - b.start
  );

}


/* =========================================================
   SIDE-BY-SIDE STAFF LANES
========================================================= */

function assignLanes(items) {

  const laneEnds = [];


  items.forEach(item => {

    let lane = -1;


    for (
      let i = 0;
      i < laneEnds.length;
      i++
    ) {

      if (
        laneEnds[i] <=
        item.start
      ) {

        lane = i;

        break;

      }

    }


    if (lane === -1) {

      lane =
        laneEnds.length;

      laneEnds.push(
        item.end
      );

    }


    else {

      laneEnds[lane] =
        item.end;

    }


    item.lane =
      lane;

  });


  return {

    items:items,

    laneCount:
      Math.max(
        laneEnds.length,
        1
      )

  };

}


/* =========================================================
   ACTIVITY COLUMN
========================================================= */

function makeActivityTrack(
  activities
) {

  const track =
    document.createElement(
      "div"
    );


  track.className =
    "activity-track";


  activities.forEach(
    activity => {


      const block =
        document.createElement(
          "div"
        );


      block.className =
        "activity-block";


      const top =
        (
          (activity.start -
           DAY_START) /

          DAY_LENGTH

        ) * 100;


      const height =
        (
          (activity.end -
           activity.start) /

          DAY_LENGTH

        ) * 100;


      block.style.top =
        top + "%";


      block.style.height =
        height + "%";


      block.innerHTML =

        '<span class="activity-name">' +

        activity.name +

        "</span>" +

        '<span class="activity-time">' +

        minutesToLabel(
          activity.start
        ) +

        "–" +

        minutesToLabel(
          activity.end
        ) +

        "</span>";


      track.appendChild(
        block
      );

    }
  );


  return track;

}


/* =========================================================
   CLASSROOM TIMELINE
========================================================= */

function makeRoomTrack(
  assignment,
  day,
  activities,
  colorClass
) {

  const track =
    document.createElement(
      "div"
    );


  track.className =
    "room-track";


  /* Activity divider lines */

  activities.forEach(
    (activity,index) => {


      if (index === 0) {
        return;
      }


      const line =
        document.createElement(
          "div"
        );


      line.className =
        "activity-line";


      line.style.top =

        (
          (activity.start -
           DAY_START) /

          DAY_LENGTH *

          100

        ) + "%";


      track.appendChild(
        line
      );

    }
  );


  /* Staff assignments */

  let assignments =
    getAssignments(
      assignment,
      day
    );


  assignments =
    assignments.filter(
      item => {

        return (

          item.start <
            DAY_END &&

          item.end >
            DAY_START

        );

      }
    );


  assignments =
    assignments.map(
      item => ({

        ...item,

        start:
          Math.max(
            item.start,
            DAY_START
          ),

        end:
          Math.min(
            item.end,
            DAY_END
          )

      })
    );


  assignments =
    mergeContinuous(
      assignments
    );


  const laneData =
    assignLanes(
      assignments
    );


  laneData.items.forEach(
    item => {


      const block =
        document.createElement(
          "div"
        );


      block.className =
        "staff-block " +
        colorClass;


      const top =
        (
          (item.start -
           DAY_START) /

          DAY_LENGTH *

          100
        );


      const height =
        (
          (item.end -
           item.start) /

          DAY_LENGTH *

          100
        );


      const laneWidth =
        100 /
        laneData.laneCount;


      block.style.left =

        "calc(" +

        (
          item.lane *
          laneWidth
        ) +

        "% + 2px)";


      block.style.width =

        "calc(" +

        laneWidth +

        "% - 4px)";


      block.style.top =

        "calc(" +

        top +

        "% + 2px)";


      block.style.height =

        "calc(" +

        height +

        "% - 4px)";


      block.innerHTML =

        '<span class="staff-name">' +

        item.staff +

        "</span>" +

        '<span class="staff-time">' +

        minutesToLabel(
          item.start
        ) +

        "–" +

        minutesToLabel(
          item.end
        ) +

        "</span>";


      track.appendChild(
        block
      );

    }
  );


  return track;

}

/* =========================================================

========================================================= */

function renderCare(
  elementID,
  assignment,
  day
) {

  const element =
    document.getElementById(
      elementID
    );


  let items =
    getAssignments(
      assignment,
      day
    );


  items =
    mergeContinuous(
      items
    );


  if (!items.length) {

    element.innerHTML =
      '<span style="color:#888">—</span>';

    return;

  }


  element.innerHTML =

    items.map(
      item => {

        return (

          '<span class="care-person">' +

          item.staff +

          '<span class="care-time">' +

          minutesToLabel(
            item.start
          ) +

          "–" +

          minutesToLabel(
            item.end
          ) +

          "</span>" +

          "</span>"

        );

      }
    ).join("");

}

/* =========================================================
   OTHER DUTIES
========================================================= */

function renderDuties(day) {

  const content =
    document.getElementById(
      "duties-content"
    );


  content.innerHTML = "";


  const table =
    document.createElement(
      "div"
    );


  table.className =
    "duties-table";


  [
    "Time",
    "Duty",
    "Staff"
  ].forEach(
    label => {


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "duty-header";


      header.textContent =
        label;


      table.appendChild(
        header
      );

    }
  );


  let duties = [];


  [
    "Rest Transition",
    "3rd Year"
  ].forEach(
    assignment => {


      const items =
        getAssignments(
          assignment,
          day
        );


      items.forEach(
        item => {


          duties.push({

            assignment:
              assignment,

            staff:
              item.staff,

            start:
              item.start,

            end:
              item.end

          });

        }
      );

    }
  );


  /*
  Group staff doing the exact
  same duty at the same time.
  */

  const grouped = {};


  duties.forEach(
    item => {


      const key =

        item.assignment +
        "|" +
        item.start +
        "|" +
        item.end;


      if (!grouped[key]) {

        grouped[key] = {

          assignment:
            item.assignment,

          start:
            item.start,

          end:
            item.end,

          staff:[]

        };

      }


      grouped[key]
        .staff
        .push(
          item.staff
        );

    }
  );


  const rows =
    Object
      .values(grouped)
      .sort(
        (a,b) =>
          a.start - b.start
      );


  if (!rows.length) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-message";


    empty.textContent =
      "No additional duties scheduled.";


    table.appendChild(
      empty
    );

  }


  rows.forEach(
    row => {


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "duty-cell";


      time.textContent =

        minutesToLabel(
          row.start
        ) +

        "–" +

        minutesToLabel(
          row.end
        );


      const duty =
        document.createElement(
          "div"
        );


      duty.className =
        "duty-cell duty-name";


      duty.textContent =
        row.assignment;


      const staff =
        document.createElement(
          "div"
        );


      staff.className =
        "duty-cell";


      staff.textContent =

        [
          ...new Set(
            row.staff
          )
        ].join(", ");


      table.appendChild(
        time
      );


      table.appendChild(
        duty
      );


      table.appendChild(
        staff
      );

    }
  );


  content.appendChild(
    table
  );

}

/* =========================================================
   AUTOMATIC DEFAULT DAY

   Monday-Friday:
   Opens to today's actual day.

   Saturday/Sunday:
   Opens to Monday.
========================================================= */

function setDefaultDay() {

  const today =
    new Date()
      .getDay();


  const weekdays = {

    1:"Monday",
    2:"Tuesday",
    3:"Wednesday",
    4:"Thursday",
    5:"Friday"

  };


  const defaultDay =
    weekdays[today] ||
    "Monday";


  document
    .getElementById("day")
    .value =
      defaultDay;

}


/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadSchedule() {

  try {

    const response =
      await fetch(
        CSV_URL
      );


    if (!response.ok) {

      throw new Error(
        "Could not load schedule."
      );

    }


    const text =
      await response.text();


    scheduleData =
      parseCSV(
        text
      );


    renderAll();

  }


  catch(error) {

    console.error(
      error
    );


    document
      .getElementById(
        "primary-content"
      )
      .innerHTML =

      '<div class="status error">' +

      "Schedule could not be loaded." +

      "</div>";

  }

}


/* =========================================================
   START
========================================================= */

setDefaultDay();


document
  .getElementById("day")
  .addEventListener(
    "change",
    renderAll
  );


loadSchedule();

</script>
